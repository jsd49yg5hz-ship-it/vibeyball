<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibeyBall – Volleyball-Trainingsplaner</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏐</text></svg>">
</head>
<body>

  <header class="app-header">
    <h1>🏐 VibeyBall <span class="subtitle">Trainingsplaner für Volleyball-Coaches</span></h1>
  </header>

  <!-- ═══════════ Ansicht: Session-Übersicht ═══════════ -->
  <main id="view-list" class="view">
    <div class="toolbar">
      <h2>Meine Trainingssessions</h2>
      <button class="btn btn-primary" id="btn-new-session">+ Neue Session</button>
    </div>
    <div id="session-list" class="session-list"></div>
    <p id="empty-hint" class="empty-hint hidden">
      Noch keine Sessions vorhanden. Erstelle deine erste Trainingssession!
    </p>
  </main>

  <!-- ═══════════ Ansicht: Session-Editor ═══════════ -->
  <main id="view-editor" class="view hidden">
    <div class="toolbar">
      <button class="btn" id="btn-back">← Zur Übersicht</button>
      <div class="toolbar-actions">
        <button class="btn btn-primary" id="btn-pdf">📄 Als PDF exportieren</button>
      </div>
    </div>

    <div class="editor-grid">
      <!-- Linke Spalte: Session-Daten & Ablauf -->
      <section class="panel">
        <h3>Session-Details</h3>
        <div class="form-grid">
          <label>Titel
            <input type="text" id="f-title" placeholder="z. B. Annahme &amp; Sideout">
          </label>
          <label>Mannschaft
            <input type="text" id="f-team" placeholder="z. B. Damen 1">
          </label>
          <label>Datum
            <input type="date" id="f-date">
          </label>
          <label>Uhrzeit
            <input type="time" id="f-time">
          </label>
          <label>Ort / Halle
            <input type="text" id="f-location" placeholder="z. B. Sporthalle ETH">
          </label>
          <label>Trainingsschwerpunkt
            <input type="text" id="f-focus" placeholder="z. B. Annahme unter Druck">
          </label>
          <label class="span-2">Notizen
            <textarea id="f-notes" rows="2" placeholder="Material, Abwesenheiten, Hinweise …"></textarea>
          </label>
        </div>

        <div class="plan-header">
          <h3>Trainingsablauf</h3>
          <span id="total-duration" class="badge">0 min</span>
        </div>
        <ol id="plan-list" class="plan-list"></ol>
        <p id="plan-empty" class="empty-hint">
          Füge rechts Übungen aus der Bibliothek hinzu.
        </p>
      </section>

      <!-- Rechte Spalte: Übungsbibliothek -->
      <section class="panel">
        <h3>Übungsbibliothek</h3>
        <div class="library-filters">
          <input type="search" id="f-search" placeholder="Übung suchen …">
          <select id="f-category">
            <option value="">Alle Kategorien</option>
          </select>
          <select id="f-level">
            <option value="">Alle Niveaus</option>
            <option value="Anfänger">Anfänger</option>
            <option value="Fortgeschritten">Fortgeschritten</option>
            <option value="Alle">Für alle Niveaus</option>
          </select>
        </div>
        <div id="exercise-list" class="exercise-list"></div>
      </section>
    </div>
  </main>

  <!-- ═══════════ Druckansicht (nur für PDF-Export sichtbar) ═══════════ -->
  <div id="print-view" class="print-view" aria-hidden="true"></div>

  <script src="exercises.js"></script>
  <script src="app.js"></script>
</body>
</html>
