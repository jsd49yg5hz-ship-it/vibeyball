<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geteilter Trainingsplan – VibeyBall</title>
  <script src="../theme-init.js"></script>
  <link rel="stylesheet" href="../styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ea580c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3Cpath d='M12 12a13.3 13.3 0 0 0 0-10'/%3E%3Cpath d='M12 12a13.3 13.3 0 0 0-8.66 5'/%3E%3Cpath d='M12 12a13.3 13.3 0 0 0 8.66 5'/%3E%3Cpath d='M11.26 6.99a16.4 16.4 0 0 1 10.6 3.74'/%3E%3Cpath d='M6.32 3.7a16.4 16.4 0 0 1 1.94 11.06'/%3E%3Cpath d='M18.34 17.66a16.4 16.4 0 0 1-12.5-1.42'/%3E%3C/svg%3E">
</head>
<body>

  <header class="app-header">
    <h1>
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 12a13.3 13.3 0 0 0 0-10"/>
        <path d="M12 12a13.3 13.3 0 0 0-8.66 5"/>
        <path d="M12 12a13.3 13.3 0 0 0 8.66 5"/>
        <path d="M11.26 6.99a16.4 16.4 0 0 1 10.6 3.74"/>
        <path d="M6.32 3.7a16.4 16.4 0 0 1 1.94 11.06"/>
        <path d="M18.34 17.66a16.4 16.4 0 0 1-12.5-1.42"/>
      </svg>
      VibeyBall <span class="subtitle">Geteilter Trainingsplan</span></h1>
    <button class="btn btn-header btn-theme" id="btn-theme" title="Hell/Dunkel umschalten">🌙</button>
  </header>

  <main class="view">
    <div id="share-loading" class="empty-hint">Trainingsplan wird geladen …</div>

    <div id="share-content" class="hidden">
      <div class="toolbar">
        <h2 id="sh-title"></h2>
        <button class="btn btn-primary" id="btn-pdf">📄 PDF erstellen</button>
      </div>

      <section class="panel">
        <div class="share-meta" id="sh-meta"></div>
        <div class="plan-header">
          <h3>Trainingsablauf</h3>
          <span id="sh-total" class="badge"></span>
        </div>
        <ol id="sh-plan" class="plan-list"></ol>
        <div id="sh-notes" class="share-notes hidden"></div>
      </section>
    </div>
  </main>

  <script src="../vendor/jspdf.umd.min.js"></script>
  <script src="../pdf.js"></script>
  <script src="../share.js"></script>
</body>
</html>
