<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geteilter Trainingsplan – VibeyBall</title>
  <script>
    document.documentElement.dataset.theme = localStorage.getItem("vb-theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  </script>
  <link rel="stylesheet" href="../styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ea580c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3Cpath d='M12 12a13.3 13.3 0 0 0 0-10'/%3E%3Cpath d='M12 12a13.3 13.3 0 0 0-8.66 5'/%3E%3Cpath d='M12 12a13.3 13.3 0 0 0 8.66 5'/%3E%3Cpath d='M11.26 6.99a16.4 16.4 0 0 1 10.6 3.74'/%3E%3Cpath d='M6.32 3.7a16.4 16.4 0 0 1 1.94 11.06'/%3E%3Cpath d='M18.34 17.66a16.4 16.4 0 0 1-12.5-1.42'/%3E%3C/svg%3E">
</head>
<body>

  <header class="app-header">
    <h1>
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 12a13.3 13.3 0 0 0 0-10"/>
        <path d="M12 12a13.3 13.3 0 0 0-8.66 5"/>
        <path d="M12 12a13.3 13.3 0 0 0 8.66 5"/>
        <path d="M11.26 6.99a16.4 16.4 0 0 1 10.6 3.74"/>
        <path d="M6.32 3.7a16.4 16.4 0 0 1 1.94 11.06"/>
        <path d="M18.34 17.66a16.4 16.4 0 0 1-12.5-1.42"/>
      </svg>
      VibeyBall <span class="subtitle">Geteilter Trainingsplan</span></h1>
    <button class="btn btn-header btn-theme" id="btn-theme" title="Hell/Dunkel umschalten">🌙</button>
  </header>

  <main class="view">
    <div id="share-loading" class="empty-hint">Trainingsplan wird geladen …</div>

    <div id="share-content" class="hidden">
      <div class="toolbar">
        <h2 id="sh-title"></h2>
        <button class="btn btn-primary" id="btn-pdf">📄 PDF erstellen</button>
      </div>

      <section class="panel">
        <div class="share-meta" id="sh-meta"></div>
        <div class="plan-header">
          <h3>Trainingsablauf</h3>
          <span id="sh-total" class="badge"></span>
        </div>
        <ol id="sh-plan" class="plan-list"></ol>
        <div id="sh-notes" class="share-notes hidden"></div>
      </section>
    </div>
  </main>

  <script src="../vendor/jspdf.umd.min.js"></script>
  <script src="../pdf.js"></script>
  <script>
    const $ = (sel) => document.querySelector(sel);

    // Theme-Umschalter
    $("#btn-theme").textContent = document.documentElement.dataset.theme === "dark" ? "☀️" : "🌙";
    $("#btn-theme").addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      localStorage.setItem("vb-theme", next);
      document.documentElement.dataset.theme = next;
      $("#btn-theme").textContent = next === "dark" ? "☀️" : "🌙";
    });

    function esc(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    function formatDate(iso) {
      if (!iso) return "";
      return new Date(iso + "T00:00:00").toLocaleDateString("de-CH", {
        weekday: "long", day: "2-digit", month: "2-digit", year: "numeric",
      });
    }

    function addMinutes(hhmm, minutes) {
      const [h, m] = hhmm.split(":").map(Number);
      const total = h * 60 + m + minutes;
      return String(Math.floor(total / 60) % 24).padStart(2, "0") + ":" + String(total % 60).padStart(2, "0");
    }

    async function load() {
      const token = location.pathname.split("/").pop();
      const res = await fetch("../api/shared/" + token);
      if (!res.ok) {
        $("#share-loading").textContent = "Dieser Trainingsplan existiert nicht mehr oder wird nicht mehr geteilt.";
        return;
      }
      const s = await res.json();
      const total = s.items.reduce((sum, it) => sum + (Number(it.dauer) || 0), 0);

      $("#sh-title").textContent = s.titel || "Trainingssession";
      $("#sh-total").textContent = total + " min";
      $("#sh-meta").innerHTML = [
        s.team && `<strong>Mannschaft:</strong> ${esc(s.team)}`,
        s.datum && `<strong>Datum:</strong> ${formatDate(s.datum)}${s.uhrzeit ? ", " + esc(s.uhrzeit) + " Uhr" : ""}`,
        s.ort && `<strong>Ort:</strong> ${esc(s.ort)}`,
        (s.tags || []).length && `<strong>Fokus:</strong> ${s.tags.map(esc).join(", ")}`,
      ].filter(Boolean).join(" · ");

      let clock = s.uhrzeit || null;
      $("#sh-plan").innerHTML = s.items.map((item, i) => {
        const time = clock ? `${clock}–${addMinutes(clock, Number(item.dauer) || 0)}` : "";
        if (clock) clock = addMinutes(clock, Number(item.dauer) || 0);
        return `
          <li class="plan-item plan-item-static">
            <span class="order">${i + 1}</span>
            <span>
              <span class="name">${esc(item.name)}</span>
              ${time ? `<span class="time-range">${time}</span>` : ""}
              <span class="cat"> · ${esc(item.kategorie)} · ${item.dauer} min</span>
              <div class="ex-desc">${esc(item.beschreibung)}</div>
              ${item.notiz ? `<div class="ex-desc"><em>Notiz: ${esc(item.notiz)}</em></div>` : ""}
            </span>
          </li>`;
      }).join("") || `<p class="empty-hint">Keine Übungen geplant.</p>`;

      if (s.notizen) {
        $("#sh-notes").innerHTML = `<strong>Notizen:</strong> ${esc(s.notizen)}`;
        $("#sh-notes").classList.remove("hidden");
      }

      $("#btn-pdf").addEventListener("click", () =>
        generateSessionPdf(s, (item) => ({ name: item.name, kategorie: item.kategorie, beschreibung: item.beschreibung })));

      $("#share-loading").classList.add("hidden");
      $("#share-content").classList.remove("hidden");
    }

    load();
  </script>
</body>
</html>
